<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Superbébé</title>
  <meta name="description" content="Quand sortir avec bébé, comment l'habiller, et ce qu'il lui faudra bientôt. Repères officiels, pas d'avis médical.">
  <meta name="theme-color" content="#fbf8f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Superbébé">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="fonts/poppins-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/poppins-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Avant le premier affichage : clair le jour, sombre après le coucher (main.js affine ensuite, selon l'écran).
    try {
      var b = localStorage.getItem('sb.coucher'), h = new Date().getHours();
      var bed = b ? parseInt(JSON.parse(b), 10) : 19;
      document.documentElement.dataset.theme = (h >= bed || h < 6) ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
  <script data-goatcounter="https://brunocambianica.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <p class="boot">Chargement…</p>
  </div>
  <noscript><p class="boot">Superbébé a besoin de JavaScript pour fonctionner. Sans JavaScript, le guide dit comment habiller bébé selon la température, dehors, à la maison et la nuit : <a href="../">comment habiller bébé selon la température</a>.</p></noscript>
</body>
</html>
